<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5c">
<title>8 天训练周期 · 组数计数器</title>
<style>
:root{
  --bg:#0f1214; --card:#181d20; --card2:#1f2529; --ink:#eef1f3; --ink2:#a8b2b8; --ink3:#6f7a81;
  --line:#2a3136; --accent:#1db794; --accent-dim:#0f7a60;
  --warn:#e0a63c; --danger:#e0604c; --blue:#4a9fd8;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ── 头部 ── */
header{padding:calc(18px + env(safe-area-inset-top)) 0 14px;text-align:center}
header h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
header p{font-size:12.5px;color:var(--ink3);margin-top:4px}

/* ── 阶段选择器 ── */
.phaser{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.phbtn{
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:8px 3px 7px;text-align:center;cursor:pointer;transition:.15s;
  font-family:inherit;color:var(--ink2);
}
.phbtn:active{transform:scale(.96)}
.phbtn .pn{display:block;font-size:13px;font-weight:700;line-height:1.25}
.phbtn .pw{display:block;font-size:9.5px;margin-top:1px;opacity:.75}
.phbtn .pt{display:block;font-size:9px;margin-top:2px;color:var(--ink3)}
.phbtn.on{background:var(--blue);border-color:var(--blue);color:#04121c}
.phbtn.on .pw,.phbtn.on .pt{color:#04121c;opacity:.85}

/* ── 日选择器 ── */
.daypicker{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
  margin-bottom:10px;
}
.daybtn{
  background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:9px 2px 8px;text-align:center;cursor:pointer;
  transition:.15s;font-family:inherit;color:var(--ink2);
}
.daybtn:active{transform:scale(.95)}
.daybtn .n{display:block;font-size:16px;font-weight:700;line-height:1.2}
.daybtn .t{display:block;font-size:10px;margin-top:2px;opacity:.85}
.daybtn.rest{background:#16191b;border-style:dashed}
.daybtn.rest .t{color:var(--accent)}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:#04150f}
.daybtn.on .t{color:#04150f;opacity:.8}
.daybtn.partial::after{
  content:'';display:block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin:3px auto 0;
}
.daybtn.on.partial::after{background:#04150f}

/* ── 今日概览 ── */
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px;
}
.hero .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .nm{font-size:17px;font-weight:700}
.hero .sub{font-size:12px;color:var(--ink3);margin-top:3px}
.ring{position:relative;width:52px;height:52px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .35s ease}
.ring .txt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.ring .txt small{font-size:9px;font-weight:400;color:var(--ink3)}
.hero.stim{background:#1d1a14;border-color:#3d3419}
.hero.stim .ring .fg{stroke:var(--warn)}

/* ── 分区标题 ── */
.sec{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;color:var(--ink3);
  letter-spacing:.6px;margin:20px 0 9px;padding-left:2px;
}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.sec .tagx{
  font-size:10px;padding:1px 6px;border-radius:5px;
  background:var(--card2);color:var(--ink2);letter-spacing:0;
}

/* ── 动作卡 ── */
.ex{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;
}
.ex-top{display:flex;align-items:center;gap:12px;padding:13px 14px}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:15.5px;font-weight:650;line-height:1.35}
.ex-meta{font-size:12px;color:var(--ink3);margin-top:3px}
.ex-tip{
  font-size:12.5px;color:var(--ink2);line-height:1.6;
  padding:0 14px 12px;border-top:1px dashed var(--line);margin-top:2px;padding-top:10px;
}
.ex-tip b{color:var(--ink)}
.ex-tip .warnc{color:var(--warn);font-weight:650}

/* 计数器 */
.ctr{
  display:flex;align-items:center;gap:9px;flex-shrink:0;
}
.ctr-btn{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);
  font-size:24px;font-weight:600;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.12s;font-family:inherit;user-select:none;
}
.ctr-btn:active{transform:scale(.9);background:var(--accent-dim);border-color:var(--accent)}
.ctr-btn.reset{font-size:11px;font-weight:700;color:var(--ink3);width:38px;height:38px}
.ctr-num{
  min-width:34px;text-align:center;font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1;
}
.ex.done{border-color:var(--accent);background:#12211d}
.ex.done .ex-name::after{content:'✓';color:var(--accent);margin-left:6px;font-weight:700}
.ex.rest-ex{opacity:.5}
.ex.opt{background:#15191b}
.ex.rot{border-left:3px solid var(--blue)}
.ex.rot .ex-name::before{content:'轮换';display:inline-block;font-size:9.5px;font-weight:700;background:#1a3a4d;color:#7cc6f0;padding:1px 5px;border-radius:4px;margin-right:7px;vertical-align:2px;letter-spacing:.5px}
.ex-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.setn{color:var(--ink2)}
.freq{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--ink3);white-space:nowrap}
.ex.rot .freq{background:#1a3a4d;color:#7cc6f0}
.capnote{background:#141b1e;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin:0 0 10px}
.capnote b{color:var(--ink)}
.capnote .row{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--ink3)}
.capnote .row span{white-space:nowrap}

/* ── 有氧日 ── */
.cardio{
  background:linear-gradient(135deg,#1d1a14,#1a1714);
  border:1px solid #3d3419;border-radius:var(--r);padding:14px;
}
.cardio h4{font-size:14.5px;font-weight:700;color:var(--warn);margin-bottom:8px}
.cardio ul{margin:0;padding-left:19px;color:var(--ink2);font-size:13px}
.cardio li{margin-bottom:5px}

/* ── 体态区块 ── */
.post{display:block;margin-top:8px}
.post summary{
  list-style:none;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;display:flex;align-items:center;gap:10px;
}
.post summary::-webkit-details-marker{display:none}
.post summary .ttl{flex:1;font-size:14px;font-weight:650}
.post summary .cnt{font-size:11px;color:var(--ink3)}
.post summary .arr{color:var(--ink3);font-size:12px;transition:.2s}
.post[open] summary .arr{transform:rotate(180deg)}
.post[open] summary{border-radius:var(--r) var(--r) 0 0;border-bottom:none}
.post-in{border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.pitem{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--line);background:var(--card);
}
.pitem:last-child{border-bottom:none}
.pitem.daily{background:#151b1a}
.pitem .pk{
  width:44px;flex-shrink:0;text-align:center;font-size:10.5px;
  color:var(--ink3);line-height:1.3;
}
.pitem .pk b{display:block;font-size:13px;color:var(--ink)}
.pitem .pt{flex:1;min-width:0}
.pitem .pn{font-size:14px;font-weight:600}
.pitem .pd{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ── 提示条 ── */
.note{
  background:#16191b;border-left:3px solid var(--blue);
  border-radius:0 9px 9px 0;padding:11px 13px;
  font-size:12.5px;color:var(--ink2);line-height:1.6;margin:10px 0 0;
}
.note b{color:var(--ink)}

/* ── 底部重置 ── */
.foot{margin-top:24px;text-align:center}
.btn-reset{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--ink3);font-size:12.5px;padding:9px 18px;cursor:pointer;font-family:inherit;
}
.btn-reset:active{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ── 弹层 ── */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:flex-end;justify-content:center;z-index:50;
}
.sheet.on{display:flex}
.sheet-in{
  background:var(--card);width:100%;max-width:560px;
  border-radius:18px 18px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet-in h3{font-size:16px;margin-bottom:4px}
.sheet-in .s-sub{font-size:12px;color:var(--ink3);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:650}
.sheet-in .note{margin-top:14px}

/* 大屏时居中显示为卡片 */
@media(min-width:600px){
  body{padding:20px 0}
  header{padding-top:12px}
  .sheet{align-items:center}
  .sheet-in{border-radius:18px;max-width:460px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .daypicker{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>8 天训练周期</h1>
    <p>练三休一 · 8 天大周期 · 三阶段可切换 · 点一下减一组</p>
  </div>
</header>

<div class="wrap">
  <div class="phaser" id="phaser"></div>
  <div class="daypicker" id="picker"></div>
  <div id="view"></div>

  <details class="post">
    <summary>
      <span class="ttl">体态与核心每日动作</span>
      <span class="cnt" id="postCnt"></span>
      <span class="arr">▼</span>
    </summary>
    <div class="post-in" id="postList"></div>
  </details>

  <div class="note" id="restNote" style="display:none"></div>

  <div class="foot">
    <button class="btn-reset" id="btnReset">重置全部计数</button>
    <p style="font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.7">
      计数保存在本机浏览器，换设备不会同步。<br>
      依据方案 v8（26 节 · 28 条PubMed 已核验文献）
    </p>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3>今日要点</h3>
    <div class="s-sub" id="shSub"></div>
    <div id="shBody"></div>
    <div class="note" id="shNote"></div>
  </div>
</div>

<script>
/* ═══════════ 方案数据（严格对齐 v8 已核验方案） ═══════════ */

// 组数按「起步期第 1–4 周 8–10 组/肌群」设定
const DAYS = [
  { n:1, type:'A', name:'上肢 · 推 + 背 + 肩胛', dur:'约 45 分钟',
    intro:'4 个固定动作每次都做，第 5 个位轮换。斜方肌一有灼烧感立刻减重。',
    ex:[
      {id:'a1', n:'杠铃卧推', w:'6–8 次', s:[3,4,4], f:'8 天 3 次',
       tip:'肩胛后缩下沉后再推，肘角 45–70°。<b>先用空杆找动作模式</b>，能标准做 10 次再加重量。'},
      {id:'a2', n:'中立握哑铃肩上推举', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'<span class="warnc">中立握（掌心相对）——正握是上斜方代偿重灾区。</span>顶端肩胛仍下沉，不耸肩。幅度只做 90%。'},
      {id:'a3', n:'俯身哑铃划船', w:'10–12 次', s:[3,4,5], f:'8 天 3 次',
       tip:'<b>想「用手肘把肩胛往后拉」</b>，不是用手拉。腰不舒服改单臂支撑划船。'},
      {id:'a4', n:'哑铃侧平举', w:'12–15 次', s:[2,3,4], f:'8 天 3 次',
       tip:'轻重量，抬到与肩同高即可。<span class="warnc">斜方肌一有灼烧感 = 重量太大。</span>'},
      {id:'a5', n:'夹胸器械（蝴蝶机）', w:'12–15 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 1 次',
       tip:'<span class="tagx">今天轮到它</span>肘关节固定角度，靠<b>胸口收缩</b>把手臂夹拢，不是用手臂推。夹到位停 1 秒。'}
    ]},

  {n:2, type:'B', name:'下肢 + 核心', dur:'约 50 分钟',
    intro:'4 个固定动作每次都做，第 5 个位轮换。膝盖对准第二脚趾，全程不内扣。',
    ex:[
      {id:'b1', n:'杠铃深蹲（背扛）', w:'6–8 次', s:[3,4,5], f:'8 天 3 次',
       tip:'杠铃置上斜方（不是颈后）。脚尖外展 15–30°，<b>膝盖对准第二脚趾</b>。深度以不塌腰为限。'},
      {id:'b2', n:'T 杠罗马尼亚硬拉', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'<b>髋部向后推</b>、屈膝微幅、背保持中立。感受大腿后侧与臀被拉长，不是腰被拉。'},
      {id:'b3', n:'侧躺髋外展 / 蚌式', w:'15–20 次', s:[3,4,4], f:'8 天 3 次',
       tip:'练<b>臀中肌</b>——它无力会导致膝盖内扣与足外翻。脚尖朝正前方，不要外撇。'},
      {id:'b4', n:'核心（3 个动作）', w:'见说明', s:[6,6,6], f:'8 天 3 次',
       tip:'顺序：<b>腹部内收</b>（10 次停 3 秒）→ <b>死虫式</b>（8 次每侧，腰贴地）→ <b>侧平板</b>（20–40 秒）。每个动作的组数随阶段增加：起步期各 2 组 → 稳定期各 3 组。<b>练腹肌不能减腹部脂肪</b>，减脂靠热量缺口。'},
      {id:'b5', n:'臀桥 / 单腿臀桥', w:'12–15 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 2 次',
       tip:'<span class="tagx">今天轮到它</span>顶峰收缩 2 秒。<b>顶髋时肋骨下沉、不要用腰反弓</b>。臀肌有灼烧感才算对。'}
    ]},

  {n:3, type:'A', name:'上肢 · 推 + 背 + 肩胛', dur:'约 45 分钟',
    intro:'与 Day 1 同一套。今天最后一位轮到<b>前锯肌</b>。',
    ex:[
      {id:'c1', n:'杠铃卧推', w:'6–8 次', s:[3,4,4], f:'8 天 3 次',
       tip:'比上次重一点，或每组多做 1 次。<b>这就是渐进超负荷</b>。'},
      {id:'c2', n:'中立握哑铃肩上推举', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'中立握 + 肩胛下沉。出现耸肩立刻减重 20%。'},
      {id:'c3', n:'俯身哑铃划船', w:'10–12 次', s:[3,4,5], f:'8 天 3 次',
       tip:'手肘带肩胛往后拉。腰不舒服改单臂支撑划船。'},
      {id:'c4', n:'哑铃侧平举', w:'12–15 次', s:[2,3,4], f:'8 天 3 次',
       tip:'轻重量，抬到与肩同高。不耸肩。'},
      {id:'c5', n:'前锯肌训练（墙壁滑行）', w:'12 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 1 次',
       tip:'<span class="tagx">今天轮到它</span>前臂贴墙呈「W」形，沿墙推到「Y」形，<b>全程不离墙</b>。耸肩 / 离墙 / 只动手臂——这三个是常见错误。'}
    ]},

  {n:4, type:'R', name:'休息 / 有氧日', dur:'约 30 分钟',
    intro:'有氧放在力量训练后或休息日。<b>不要放在力量训练前</b>——会消耗力量表现。',
    cardio:[
      '慢跑 25–30 分钟，心率控制在最大心率的 60–70%',
      '体态模块全套（见下方「体态与核心每日动作」）',
      '泡沫轴放松：上背、臀、大腿后侧、小腿',
      '足底筋膜放松（网球或泡沫轴）每侧 60–90 秒，痛点停留 20 秒'
    ],
    note:'<b>这一天不追求强度。</b>它的作用是恢复 + 有氧累积 + 体态重点。<b>有氧放在力量训练之后或休息日</b>——放在力量训练之前会直接影响力量表现。'},

  {n:5, type:'B', name:'下肢 + 核心', dur:'约 50 分钟',
    intro:'与 Day 2 同一套。今天最后一位轮到<b>坐姿腿弯举</b>。',
    ex:[
      {id:'e1', n:'杠铃深蹲（背扛）', w:'6–8 次', s:[3,4,5], f:'8 天 3 次',
       tip:'膝盖对准第二脚趾，不内扣。这是下肢主项。'},
      {id:'e2', n:'T 杠罗马尼亚硬拉', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'髋向后推，背中立，感受臀与大腿后侧被拉长。'},
      {id:'e3', n:'侧躺髋外展 / 蚌式', w:'15–20 次', s:[3,4,4], f:'8 天 3 次',
       tip:'臀中肌。足外翻相关训练。脚尖朝前。'},
      {id:'e4', n:'核心（3 个动作）', w:'见说明', s:[6,6,6], f:'8 天 3 次',
       tip:'腹部内收 → 死虫式 → 侧平板。起步期各 2 组，稳定期各 3 组。'},
      {id:'e5', n:'坐姿腿弯举', w:'10–12 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 1 次',
       tip:'<span class="tagx">今天轮到它</span>练大腿后侧（腘绳肌）。膝关节屈到安全范围即可，<b>离心 3 秒下放</b>。'}
    ]},

  {n:6, type:'A', name:'上肢 · 推 + 背 + 肩胛', dur:'约 45 分钟',
    intro:'与 Day 1 同一套。今天最后一位轮到<b>俯身反向飞鸟</b>。',
    ex:[
      {id:'f1', n:'杠铃卧推', w:'6–8 次', s:[3,4,4], f:'8 天 3 次',
       tip:'渐进超负荷：同样次数能多做 1 个，或同样个数能多加 2.5–5 kg，就记录并推进。'},
      {id:'f2', n:'中立握哑铃肩上推举', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'中立握 + 肩胛下沉。耸肩就减重。'},
      {id:'f3', n:'俯身哑铃划船', w:'10–12 次', s:[3,4,5], f:'8 天 3 次',
       tip:'手肘带肩胛往后拉。'},
      {id:'f4', n:'哑铃侧平举', w:'12–15 次', s:[2,3,4], f:'8 天 3 次',
       tip:'轻重量，不耸肩。'},
      {id:'f5', n:'俯身哑铃反向飞鸟', w:'15 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 1 次',
       tip:'<span class="tagx">今天轮到它</span>面拉的替代动作。上身前倾 45°，<b>想「用肩胛把哑铃往后送」</b>，不是用手臂甩。轻重量。'}
    ]},

  {n:7, type:'B', name:'下肢 + 核心', dur:'约 50 分钟',
    intro:'本周期最后一次下肢。今天最后一位轮到<b>臀桥</b>。',
    ex:[
      {id:'g1', n:'杠铃深蹲（背扛）', w:'6–8 次', s:[3,4,5], f:'8 天 3 次',
       tip:'膝盖对准第二脚趾，不内扣。'},
      {id:'g2', n:'T 杠罗马尼亚硬拉', w:'8–10 次', s:[3,4,4], f:'8 天 3 次',
       tip:'髋向后推，感受臀与大腿后侧被拉长。'},
      {id:'g3', n:'侧躺髋外展 / 蚌式', w:'15–20 次', s:[3,4,4], f:'8 天 3 次',
       tip:'臀中肌。足外翻相关训练。'},
      {id:'g4', n:'核心（3 个动作）', w:'见说明', s:[6,6,6], f:'8 天 3 次',
       tip:'腹部内收 → 死虫式 → 侧平板。'},
      {id:'g5', n:'臀桥 / 单腿臀桥', w:'12–15 次', s:[3,3,4], rot:1, f:'轮换位 · 8 天 2 次',
       tip:'<span class="tagx">今天轮到它</span>顶峰收缩 2 秒，<b>肋骨下沉不要用腰反弓</b>。'}
    ]},

  {n:8, type:'R', name:'休息 / 有氧日', dur:'约 30 分钟',
    intro:'与 Day 4 相同。做完这一天，8 天周期重启。',
    cardio:[
      '慢跑 25–30 分钟，心率 60–70% 最大心率',
      '体态模块全套（见下方）',
      '泡沫轴放松：上背、臀、大腿后侧、小腿',
      '足底筋膜放松 每侧 60–90 秒'
    ],
    note:'<b>8 天为一轮，跨周滚动。</b>换算下来是每周约 5.25 次训练、每周 2 个休息日。<b>休息日安排在 A 日之后，对你的肩背与体态训练量是保护。</b>'}
];

// 三个阶段：组数按「每肌群每周组数」目标设定
const PHASES = [
  {key:'P1', name:'起步期', week:'第 1–4 周',  target:'8–10',  sets:'每个动作 2–3 组'},
  {key:'P2', name:'进阶期', week:'第 5–8 周',  target:'10–12', sets:'每个动作 3–4 组'},
  {key:'P3', name:'稳定期', week:'第 9 周起', target:'12–16', sets:'每个动作 3–5 组'}
];
let phase = 0;
try{ const v=localStorage.getItem('fitness_phase_v1'); if(v!==null) phase=Math.min(2,Math.max(0,+v)); }catch(e){}

// 当前阶段下某个动作的组数
function SETS(e){ return Array.isArray(e.s) ? e.s[phase] : e.s; }

/* ═══════════ 体态动作（来自 v8 第 7b 节） ═══════════ */
const POST=[
  {t:'刷牙/洗脸时', n:'收下巴 × 10', d:'仰卧或站立，下巴水平向后收。<b>不是低头</b>——低头是屈曲，这是矢状面上的后缩', s:10, daily:true, k:'每天'},
  {t:'刷牙/洗脸时', n:'肩胛后缩 × 12', d:'肩胛向脊柱夹紧并略下沉，<b>每组保持 3 秒</b>。全程不耸肩、不含胸', s:12, daily:true, k:'每天'},
  {t:'训练前热身', n:'俯卧 Y-T-W × 6', d:'A / Y / T / W 四个形状，每个停 2 秒', s:6, daily:false, k:'训练日'},
  {t:'训练前热身', n:'猫牛式 × 8', d:'四足跪姿脊柱一节一节屈伸，<b>重点在胸椎段</b>（中段背）', s:8, daily:false, k:'训练日'},
  {t:'训练后收尾', n:'门框胸肌拉伸 2 × 30 秒', d:'前臂贴门框，身体前倾并<b>左右转体</b>——两侧都要，重点是<b>胸小肌</b>', s:2, daily:false, k:'训练日', side:true},
  {t:'训练后收尾', n:'胸锁乳突肌拉伸 2 × 30 秒', d:'坐位，一手绕过头顶轻扶同侧太阳，头向<b>对侧耳肩方向</b>倾斜并稍后仰，另一手固定锁骨。<b>直接针对头前伸</b>', s:2, daily:false, k:'训练日', side:true},
  {t:'训练后收尾', n:'肩胛后缩 × 12', d:'肩胛夹紧下沉，保持 3 秒', s:12, daily:false, k:'训练日'},
  {t:'训练后收尾', n:'靠墙天使 × 10', d:'背贴墙，手臂贴墙上下滑动（只滑手，手不离墙）。腰离墙超一掌厚是常态', s:10, daily:false, k:'训练日'},
  {t:'睡前', n:'臀桥 × 15', d:'顶峰收缩 2 秒，<b>肋骨下沉不要用腰反弓顶高</b>', s:15, daily:false, k:'睡前'},
  {t:'睡前', n:'髋屈肌 + 腘绳肌动态拉伸 各 2 × 30 秒', d:'弓步、后腿膝着地，<b>骨盆后倾</b>时前移重心，感受大腿根前侧被拉长', s:2, daily:false, k:'睡前', side:true},
  {t:'睡前', n:'泡沫轴放松上背与胸小肌', d:'上背、腋下到胸前区域各 60 秒', s:1, daily:false, k:'睡前'}
];

/* ═══════════ 计数逻辑 ═══════════ */
const KEY='fitness_day8_v9';
let st={};
try{ st=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ st={}; }

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
function get(k){ return st[k]===undefined ? null : st[k]; }
function set(k,v){ if(v===null){ delete st[k]; }else{ st[k]=v; } save(); }
function doneCount(k,total){
  const v=get(k);
  return v===null ? 0 : Math.min(total, total-v);
}
function remaining(k,total){
  const v=get(k);
  return v===null ? total : Math.max(0,v);
}
// 计数键带上阶段，切换阶段不会串数据
function ck(dayN,exId){ return 'p'+phase+'_d'+dayN+'_'+exId; }

/* ═══════════ 渲染 ═══════════ */
const $ = s=>document.querySelector(s);
let cur=1;

function buildPhaser(){
  const box=$('#phaser');
  box.innerHTML = PHASES.map((p,i)=>
    `<button class="phbtn ${i===phase?'on':''}" data-p="${i}">
       <span class="pn">${p.name}</span>
       <span class="pw">${p.week}</span>
       <span class="pt">${p.target} 组/周</span>
     </button>`).join('');
  box.querySelectorAll('.phbtn').forEach(b=>{
    b.onclick=()=>{
      phase=+b.dataset.p;
      try{ localStorage.setItem('fitness_phase_v1',String(phase)); }catch(e){}
      buildPhaser(); buildPicker(); render();
    };
  });
}

function buildPicker(){
  const box=$('#picker');
  box.innerHTML = DAYS.map(d=>{
    const tot = d.ex ? d.ex.reduce((a,e)=>a+SETS(e),0) : 0;
    const done = d.ex ? d.ex.reduce((a,e)=>a+doneCount(ck(d.n,e.id),SETS(e)),0) : 0;
    const cls = ['daybtn', d.type==='R'?'rest':'', d.n===cur?'on':'', done>0&&done<tot?'partial':''].filter(Boolean).join(' ');
    const sub = d.type==='R' ? '有氧' : (done>0 && done<tot ? done+'/'+tot : d.type);
    return `<button class="${cls}" data-n="${d.n}"><span class="n">${d.n}</span><span class="t">${sub}</span></button>`;
  }).join('');
  box.querySelectorAll('.daybtn').forEach(b=>{
    b.onclick=()=>{ cur=+b.dataset.n; buildPicker(); render(); };
  });
}

function exCard(d,e,isOpt){
  const total=SETS(e);
  const k=ck(d.n,e.id);
  const rem=remaining(k,total);
  const fin=rem===0;
  const rot = e.rot ? ' rot' : '';
  return `<div class="ex ${fin?'done':''} ${isOpt?'opt':''}${rot}">
    <div class="ex-top">
      <div class="ex-info">
        <div class="ex-name">${e.n}</div>
        <div class="ex-meta"><span class="setn"><b>${total}</b> 组 × ${e.w}</span>${e.f?`<span class="freq">${e.f}</span>`:''}${isOpt?'<span class="freq">可选</span>':''}</div>
      </div>
      <div class="ctr">
        <button class="ctr-btn" data-k="${k}" data-t="${total}" aria-label="减一组">−</button>
        <div class="ctr-num">${rem}</div>
        <button class="ctr-btn reset" data-r="${k}" aria-label="重置">重置</button>
      </div>
    </div>
    ${e.tip?`<div class="ex-tip">${e.tip}</div>`:''}
  </div>`;
}

function render(){
  const d=DAYS.find(x=>x.n===cur);
  let h='';

  if(d.type==='R'){
    h+=`<div class="hero stim">
      <div class="hd">
        <div>
          <div class="nm">Day ${d.n} · ${d.name}</div>
          <div class="sub">${d.dur} · ${d.intro}</div>
        </div>
      </div>
    </div>
    <div class="sec">有氧与恢复</div>
    <div class="cardio">
      <h4>今天做什么</h4>
      <ul>${d.cardio.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>
    <div class="note"><b>这一天不追求强度。</b>${d.note}</div>`;
  }else{
    const tot=d.ex.reduce((a,e)=>a+SETS(e),0);
    const done=d.ex.reduce((a,e)=>a+doneCount(ck(d.n,e.id),SETS(e)),0);
    const R=22, C=2*Math.PI*R;
    h+=`<div class="hero">
      <div class="hd">
        <div>
          <div class="nm">Day ${d.n} · ${d.name}</div>
          <div class="sub">${d.dur} · 共 ${tot} 组 · ${d.ex.length} 个动作</div>
        </div>
        <div class="ring" onclick="openSheet(${d.n})" style="cursor:pointer">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="bg" cx="26" cy="26" r="${R}" fill="none" stroke-width="5"/>
            <circle class="fg" cx="26" cy="26" r="${R}" fill="none" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-done/tot)}"/>
          </svg>
          <div class="txt">${done}<small>/${tot}</small></div>
        </div>
      </div>
    </div>
    <div class="capnote">
      <b>${PHASES[phase].name} · 本日 ${tot} 组</b>（目标每肌群每周 ${PHASES[phase].target} 组）
      <div class="row"><span>固定动作：8 天做 3 次</span><span>轮换位：8 天做 1–2 次</span></div>
      <div class="row" style="color:var(--ink3)"><span>肩胛与肩后束另由下方「体态模块」每天补足</span><span>臀大肌另有深蹲 / 硬拉 / 髋外展的间接刺激</span></div>
    </div>
    <div class="sec">正式训练 <span class="tagx">点一次 = 完成一组</span></div>
    ${d.ex.map(e=>exCard(d,e,false)).join('')}
    ${d.opt?`<div class="sec">可选补充<span class="tagx">时间够再做</span></div>${d.opt.map(e=>exCard(d,e,true)).join('')}`:''}
    ${d.note?`<div class="note">${d.note}</div>`:''}
    <div class="note"><b>今日重点：</b>${d.intro}</div>`;
  }

  // 休息日提示
  if(d.type==='R'){
    $('#restNote').style.display='none';
  }else{
    const next=DAYS[d.n%8];
    $('#restNote').style.display='block';
    $('#restNote').innerHTML = next.type==='R'
      ? `<b>今天之后是 Day ${next.n} 休息/有氧日</b>——有氧放在力量训练之后或休息日，不要提前到力量训练前。`
      : `<b>今天之后是 Day ${next.n} · ${next.name}</b>。每次训练都请记下重量，这是验证「渐进超负荷」的唯一证据。`;
  }

  $('#view').innerHTML=h;
  try{ bind(); }catch(e){ console.error(e); }
}

function bind(){
  document.querySelectorAll('.ctr-btn[data-k]').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k, t=+b.dataset.t;
      const rem=remaining(k,t);
      set(k, rem>0 ? rem-1 : t);   // 减到 0 后再点 = 重置为满
      buildPicker(); render();
    };
  });
  document.querySelectorAll('.ctr-btn[data-r]').forEach(b=>{
    b.onclick=()=>{ set(b.dataset.r,null); buildPicker(); render(); };
  });
}

/* ═══════════ 体态区块 ═══════════ */
function buildPost(){
  $('#postList').innerHTML = POST.map((p,i)=>`
    <div class="pitem ${p.daily?'daily':''}">
      <div class="pk"><b>${p.s}</b>${p.s>3?p.s+' 次':'组'}<br>${p.k}</div>
      <div class="pt">
        <div class="pn">${p.n}</div>
        <div class="pd">${p.d}</div>
      </div>
    </div>`).join('');
  const daily=POST.filter(p=>p.daily).length;
  $('#postCnt').textContent=daily+' 项每天做';
}

function openSheet(n){
  const d=DAYS.find(x=>x.n===n);
  const tot=d.ex?d.ex.reduce((a,e)=>a+SETS(e),0):0;
  $('#shSub').textContent=`Day ${d.n} · ${d.name} · ${d.dur}`;
  $('#shBody').innerHTML=`
    <div class="kv"><span>总组数</span><span>${tot||'—'} 组</span></div>
    <div class="kv"><span>训练类型</span><span>${d.type==='R'?'休息 / 有氧':'力量训练'}</span></div>
    <div class="kv"><span>每肌群组数目标</span><span>第 1–4 周 8–10 组</span></div>
    <div class="kv"><span>动作数</span><span>${d.ex?d.ex.length:0} 个</span></div>`;
  $('#shNote').innerHTML=`<b>加量判据（不是看时间，是看信号）：</b><br>
    ① 训练后第二天<b>无关节痛</b>（肌肉酸可以）② 睡眠与食欲正常 ③ 上次训练的重量能达成 ④ 连续 2 周体重增速符合预期。<br><br>
    <b>热量（按体脂自报16% 设定）：</b>第 1–4 周 2570 千卡维持，第 5 周起降至 2270 千卡。蛋白每天 116 克。<br>
    <b>两条红线：</b>缺口不超 500 千卡/天；体重下降不超 0.5 公斤/周。`;
  $('#sheet').classList.add('on');
}
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('on'); };

// 两击确认（不用系统弹窗——部分预览沙箱会拦截 confirm）
let resetArmed=false, resetTimer=null;
$('#btnReset').onclick=()=>{
  const b=$('#btnReset');
  if(!resetArmed){
    resetArmed=true;
    b.textContent='再点一次确认清空';
    b.style.borderColor='var(--danger)';
    b.style.color='var(--danger)';
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{
      resetArmed=false;
      b.textContent='重置全部计数';
      b.style.borderColor=''; b.style.color='';
    },4000);
  }else{
    resetArmed=false;
    clearTimeout(resetTimer);
    st={}; save();
    b.textContent='已清空 ✓';
    setTimeout(()=>{
      b.textContent='重置全部计数';
      b.style.borderColor=''; b.style.color='';
      buildPicker(); render();
    },700);
  }
};

/* ═══════════ 启动 ═══════════ */
try{
  buildPhaser(); buildPicker(); buildPost(); render();
}catch(err){
  document.getElementById('view').innerHTML =
    '<div class="note"><b>页面初始化出错：</b><br>'+err.message+
    '<br><br>请把这段提示发给我，我会修复。</div>';
  console.error(err);
}
</script>
</body>
</html>
